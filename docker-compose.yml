services:
  postgres:
    image: postgres:16-alpine
    container_name: soms-postgres
    environment:
      POSTGRES_DB: soms_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - soms_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d soms_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  soms_pg_data:
