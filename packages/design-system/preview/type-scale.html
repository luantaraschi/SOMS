<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" /><link rel="stylesheet" href="_card.css"/>
<style>
  .row-s { display:flex; align-items:baseline; gap: 16px; padding: 8px 0; border-bottom: 1.5px dashed #0a0a0a22; }
  .row-s:last-child { border: none; }
  .tok { font-family: var(--font-mono); font-weight:700; font-size: 11px; color: var(--ink-soft); width: 96px; flex: none; }
  .sample { font-family: var(--font-display); font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
  .size { margin-left:auto; font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); }
</style>
</head><body>
<div class="card">
  <div class="row-s"><span class="tok">mega</span><span class="sample" style="font-size:48px">Aa</span><span class="size">96 / 64</span></div>
  <div class="row-s"><span class="tok">display</span><span class="sample" style="font-size:38px">Aa</span><span class="size">72 / 48</span></div>
  <div class="row-s"><span class="tok">h1</span><span class="sample" style="font-size:28px">Aa</span><span class="size">48 / 32</span></div>
  <div class="row-s"><span class="tok">h2</span><span class="sample" style="font-size:22px">Aa</span><span class="size">32 / 24</span></div>
  <div class="row-s"><span class="tok">h3</span><span class="sample" style="font-size:18px">Aa</span><span class="size">24 / 20</span></div>
  <div class="row-s"><span class="tok">base</span><span style="font-family:var(--font-body); font-size:16px;">Body</span><span class="size">16</span></div>
  <div class="row-s"><span class="tok">sm</span><span style="font-family:var(--font-body); font-size:14px;">Caption</span><span class="size">14</span></div>
</div>
</body></html>
