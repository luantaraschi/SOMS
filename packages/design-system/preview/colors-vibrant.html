<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="_card.css"/>
<style>
  .card { padding: 28px 32px; }
  .swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .sw {
    border: 3px solid var(--ink);
    border-radius: 12px;
    box-shadow: 4px 4px 0 0 var(--shadow-color);
    padding: 14px 16px;
    height: 96px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .sw .name { font-family: var(--font-display); font-weight:800; text-transform: uppercase; font-size:14px; letter-spacing: -0.01em; }
  .sw .hex  { font-family: var(--font-mono); font-weight:700; font-size: 13px; }
</style>
</head><body>
<div class="card">
  <div class="swatches">
    <div class="sw" style="background:#FFE600">
      <div class="name">Primary</div>
      <div class="hex">#FFE600</div>
    </div>
    <div class="sw" style="background:#FF3D7F; color:#fff">
      <div class="name">Secondary</div>
      <div class="hex">#FF3D7F</div>
    </div>
    <div class="sw" style="background:#B8FF1A">
      <div class="name">Success</div>
      <div class="hex">#B8FF1A</div>
    </div>
    <div class="sw" style="background:#FF9F1C">
      <div class="name">Warm</div>
      <div class="hex">#FF9F1C</div>
    </div>
    <div class="sw" style="background:#00E5FF">
      <div class="name">Info</div>
      <div class="hex">#00E5FF</div>
    </div>
    <div class="sw" style="background:#A78BFA; color:#fff">
      <div class="name">Special</div>
      <div class="hex">#A78BFA</div>
    </div>
  </div>
</div>
</body></html>
