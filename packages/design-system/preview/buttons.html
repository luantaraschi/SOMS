<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="_card.css"/>
<style>
  .btn {
    display: inline-flex; align-items:center; justify-content:center; gap: 8px;
    padding: 14px 22px;
    min-height: 48px;
    border: 3px solid var(--ink);
    border-radius: 12px;
    box-shadow: 6px 6px 0 0 var(--shadow-color);
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    cursor: pointer;
    background: var(--surface);
    color: var(--ink);
  }
  .btn-primary   { background: var(--primary); }
  .btn-secondary { background: var(--secondary); color: #fff; }
  .btn-success   { background: var(--success); }
  .btn-danger    { background: var(--danger); color: #fff; }
  .row { display:flex; flex-wrap:wrap; gap: 16px; }
  .row + .row { margin-top: 14px; }
  .btn-ghost {
    background: transparent;
    box-shadow: none;
  }
  .btn-sm { padding: 8px 14px; min-height: 36px; font-size: 13px; box-shadow: 4px 4px 0 0 var(--shadow-color); }
</style>
</head><body>
<div class="card" style="padding: 28px 32px;">
  <div class="row">
    <button class="btn btn-primary">Criar sala</button>
    <button class="btn btn-secondary">Entrar</button>
    <button class="btn btn-success">Próximo round</button>
  </div>
  <div class="row">
    <button class="btn btn-danger">Encerrar sala</button>
    <button class="btn btn-ghost">Cancelar</button>
    <button class="btn btn-primary btn-sm">Compartilhar</button>
  </div>
</div>
</body></html>
