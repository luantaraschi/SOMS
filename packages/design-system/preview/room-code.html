<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="_card.css"/>
</head><body>
<div class="card" style="padding: 18px 24px; display:flex; gap: 18px; align-items:center;">
  <div style="
      background: var(--primary);
      border: 4px solid var(--ink);
      border-radius: 20px;
      box-shadow: 8px 8px 0 0 var(--shadow-color);
      padding: 14px 22px;
      text-align: center;
      transform: rotate(-1.5deg);
      flex: none;
    ">
    <div style="font-family: var(--font-display); font-weight: 800; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink); margin-bottom: 2px;">
      Código da sala
    </div>
    <div style="font-family: var(--font-mono); font-weight: 700; font-size: 56px; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;">
      ABCD12
    </div>
  </div>
  <div style="display:flex; flex-direction:column; gap: 10px; flex: 1;">
    <button style="
      display: inline-flex; align-items:center; justify-content:center; gap: 8px;
      padding: 12px 16px; min-height: 44px;
      border: 3px solid var(--ink); border-radius: 12px;
      box-shadow: 4px 4px 0 0 var(--shadow-color);
      background: var(--surface); color: var(--ink);
      font-family: var(--font-display); font-weight: 800; font-size: 13px;
      letter-spacing: -0.01em; text-transform: uppercase; cursor: pointer;
    ">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      Copiar código
    </button>
    <button style="
      display: inline-flex; align-items:center; justify-content:center; gap: 8px;
      padding: 12px 16px; min-height: 44px;
      border: 3px solid var(--ink); border-radius: 12px;
      box-shadow: 4px 4px 0 0 var(--shadow-color);
      background: var(--secondary); color: #fff;
      font-family: var(--font-display); font-weight: 800; font-size: 13px;
      letter-spacing: -0.01em; text-transform: uppercase; cursor: pointer;
    ">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/></svg>
      Compartilhar link
    </button>
  </div>
</div>
</body></html>
