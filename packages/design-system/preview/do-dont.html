<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="_card.css"/>
<style>
  body { overflow: hidden; }
  .wrap { display:grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .box {
    border: 3px solid var(--ink); border-radius: 12px;
    padding: 14px 16px;
    font-family: var(--font-body); font-size: 13px;
    line-height: 1.4;
    background: var(--surface);
    box-shadow: 4px 4px 0 0 var(--shadow-color);
  }
  .good { background: #B8FF1A; }
  .bad  { background: #FF4D4D; color:#fff; }
  .head { font-family: var(--font-display); font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: -0.01em; margin-bottom: 4px; display:flex; gap:6px; align-items:center; }
  .badge { display:inline-flex; padding: 1px 7px; border-radius: 999px; background: var(--ink); color: var(--bg); font-family: var(--font-mono); font-weight: 700; font-size: 10px; }
</style>
</head><body>
<div class="card" style="padding: 22px 28px;">
  <div class="wrap">
    <div class="box good">
      <div class="head"><span class="badge">SIM</span> Use</div>
      Cores chapadas · bordas pretas 3-4px · sombras duras Xpx Xpx 0 0 · rotações leves -2°/+2° · springs rápidos
    </div>
    <div class="box bad">
      <div class="head"><span class="badge" style="background:var(--surface);color:#0a0a0a">NÃO</span> Evite</div>
      Gradientes suaves · shadow-md do Tailwind · bordas 1px ou cinza · texto cinza claro · centralizar tudo · animações &gt; 500ms
    </div>
  </div>
</div>
</body></html>
