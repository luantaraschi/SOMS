<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" /><link rel="stylesheet" href="_card.css"/>
<style>
  .grid { display:grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .demo {
    background: var(--surface);
    border: 3px solid var(--ink);
    height: 92px;
    display:flex; align-items:center; justify-content:center;
    font-family: var(--font-mono); font-weight:700; font-size: 12px;
  }
  .lbl { font-family: var(--font-body); font-weight:700; font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color: var(--ink-soft); margin-top: 8px; text-align:center; }
</style>
</head><body>
<div class="card">
  <div class="grid">
    <div>
      <div class="demo" style="border-radius: 8px;">8</div>
      <div class="lbl">sm — chips</div>
    </div>
    <div>
      <div class="demo" style="border-radius: 12px;">12</div>
      <div class="lbl">md — buttons</div>
    </div>
    <div>
      <div class="demo" style="border-radius: 16px;">16</div>
      <div class="lbl">lg — cards</div>
    </div>
    <div>
      <div class="demo" style="border-radius: 24px;">24</div>
      <div class="lbl">xl — heroes</div>
    </div>
  </div>
</div>
</body></html>
