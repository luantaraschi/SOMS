<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" /><link rel="stylesheet" href="_card.css"/>
<style>
  body { padding: 6px 0; }
  .row { display:flex; gap:18px; align-items:center; justify-content: center; padding: 18px 0; }
  .card-demo {
    width: 110px; height: 110px;
    background: var(--surface);
    border: 3px solid var(--ink);
    border-radius: 16px;
    box-shadow: 6px 6px 0 0 var(--shadow-color);
    display:flex; align-items:center; justify-content:center;
    font-family: var(--font-display); font-weight: 800; font-size: 22px;
  }
  .lbl { font-family: var(--font-body); font-weight:700; font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color: var(--ink-soft); text-align:center; margin-top:6px; }
</style>
</head><body>
<div class="card">
  <div class="row">
    <div>
      <div class="card-demo" style="background:#FFE600; transform: rotate(-2deg);">1</div>
      <div class="lbl">-2°</div>
    </div>
    <div>
      <div class="card-demo" style="background:#FF3D7F; color:#fff; transform: rotate(1.5deg);">2</div>
      <div class="lbl">+1.5°</div>
    </div>
    <div>
      <div class="card-demo" style="background:#B8FF1A; transform: rotate(-1deg);">3</div>
      <div class="lbl">-1°</div>
    </div>
    <div>
      <div class="card-demo" style="background:#00E5FF; transform: rotate(2deg);">4</div>
      <div class="lbl">+2°</div>
    </div>
  </div>
  <p style="margin: 8px 32px 0; font-family: var(--font-body); font-size:13px; color: var(--ink-soft); line-height: 1.4; text-align: center;">
    Cards <strong style="color:var(--ink)">não ficam parados</strong>. Rotação base -2° a 2°, alternando por index (<code style="font-family:var(--font-mono); background:#0a0a0a0d; padding:2px 6px; border-radius:4px;">index % 2 ? +1.5 : -1.5</code>).
  </p>
</div>
</body></html>
