<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="_card.css"/>
<style>
  .grid { display:grid; grid-template-columns: repeat(4, 1fr); gap: 28px 18px; padding-right: 16px; padding-bottom: 12px; }
  .demo {
    background: var(--surface);
    border: 3px solid var(--ink);
    border-radius: 12px;
    height: 84px;
    display:flex; align-items:center; justify-content:center;
    font-family: var(--font-mono); font-weight:700; font-size: 13px;
  }
  .lbl { font-family: var(--font-body); font-weight:700; font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color: var(--ink-soft); margin-top: 8px; text-align:center; }
</style>
</head><body>
<div class="card">
  <div class="grid">
    <div>
      <div class="demo" style="box-shadow: 3px 3px 0 0 var(--shadow-color);">sm 3px</div>
      <div class="lbl">inputs · chips</div>
    </div>
    <div>
      <div class="demo" style="box-shadow: 6px 6px 0 0 var(--shadow-color);">md 6px</div>
      <div class="lbl">buttons · cards</div>
    </div>
    <div>
      <div class="demo" style="box-shadow: 8px 8px 0 0 var(--shadow-color);">lg 8px</div>
      <div class="lbl">cards importantes</div>
    </div>
    <div>
      <div class="demo" style="box-shadow: 12px 12px 0 0 var(--shadow-color);">xl 12px</div>
      <div class="lbl">hero · pódio</div>
    </div>
  </div>
</div>
</body></html>
