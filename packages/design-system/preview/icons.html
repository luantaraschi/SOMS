<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" /><link rel="stylesheet" href="_card.css"/>
<style>
  .grid { display:grid; grid-template-columns: repeat(4, 1fr); gap: 18px 14px; }
  .cell { display:flex; flex-direction:column; align-items:center; gap: 6px; }
  .ic-box {
    width: 64px; height: 64px;
    background: var(--surface);
    border: 3px solid var(--ink);
    border-radius: 12px;
    box-shadow: 4px 4px 0 0 var(--shadow-color);
    display:flex; align-items:center; justify-content:center;
  }
  svg { width: 30px; height: 30px; stroke: var(--ink); fill: none; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--ink-soft); font-weight: 700; }
</style>
</head><body>
<div class="card" style="padding: 22px 32px;">
  <div class="grid">
    <div class="cell">
      <div class="ic-box"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
      <div class="lbl">Music</div>
    </div>
    <div class="cell">
      <div class="ic-box"><svg viewBox="0 0 24 24"><path d="M2 4l3 12h14l3-12-6 4-4-8-4 8z"/></svg></div>
      <div class="lbl">Crown</div>
    </div>
    <div class="cell">
      <div class="ic-box"><svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></div>
      <div class="lbl">Zap</div>
    </div>
    <div class="cell">
      <div class="ic-box"><svg viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"/></svg></div>
      <div class="lbl">Play</div>
    </div>
    <div class="cell">
      <div class="ic-box"><svg viewBox="0 0 24 24"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1v-7h3z"/><path d="M3 19a2 2 0 0 0 2 2h1v-7H3z"/></svg></div>
      <div class="lbl">Headphones</div>
    </div>
    <div class="cell">
      <div class="ic-box"><svg viewBox="0 0 24 24"><path d="M6 9H4l-2 4v6h20v-6l-2-4h-2"/><path d="M12 2v15"/><path d="M5 21h14"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="7" r="2"/></svg></div>
      <div class="lbl">Trophy</div>
    </div>
    <div class="cell">
      <div class="ic-box"><svg viewBox="0 0 24 24"><path d="M12 3l2 5 5 1-4 4 1 6-4-3-4 3 1-6-4-4 5-1z"/></svg></div>
      <div class="lbl">Sparkles</div>
    </div>
    <div class="cell">
      <div class="ic-box"><svg viewBox="0 0 24 24"><path d="M9 21a3 3 0 0 1-3-3v-2H4v-1l3-3V7a5 5 0 1 1 10 0v5l3 3v1h-2v2a3 3 0 0 1-3 3M9 21h6"/></svg></div>
      <div class="lbl">Skull (Caótica)</div>
    </div>
  </div>
</div>
</body></html>
