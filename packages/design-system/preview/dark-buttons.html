<!doctype html>
<html lang="pt-BR" data-theme="dark"><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="_card.css"/>
<style>
  html, body { background: #110A1F !important; }
  .card { background: #110A1F; color: #FFFCF2; padding: 28px 32px; }
  .btn {
    display: inline-flex; align-items:center; justify-content:center; gap: 8px;
    padding: 14px 22px;
    min-height: 48px;
    border: 3px solid #FFFCF2;
    border-radius: 12px;
    box-shadow: 6px 6px 0 0 #FF3D7F;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    cursor: pointer;
    background: #1E1432;
    color: #FFFCF2;
  }
  .btn-primary   { background: #FFD60A; color: #0A0A0A; }
  .btn-secondary { background: #FF5C9A; color: #fff; }
  .btn-success   { background: #B8FF1A; color: #0A0A0A; }
  .btn-danger    { background: #FF7070; color: #fff; }
  .row { display:flex; flex-wrap:wrap; gap: 16px; }
  .row + .row { margin-top: 14px; }
  .btn-ghost { background: transparent; box-shadow: none; }
</style>
</head><body>
<div class="card">
  <div class="row">
    <button class="btn btn-primary">Criar sala</button>
    <button class="btn btn-secondary">Entrar</button>
    <button class="btn btn-success">Próximo round</button>
  </div>
  <div class="row">
    <button class="btn btn-danger">Encerrar sala</button>
    <button class="btn btn-ghost">Cancelar</button>
    <button class="btn">Default</button>
  </div>
</div>
</body></html>
