<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" /><link rel="stylesheet" href="_card.css"/>
</head><body>
<div class="card">
  <p style="margin:0; font-family: var(--font-body); font-weight: 400; font-size: 18px; line-height: 1.5;">
    Todo mundo acha que sabe a música — até começar a tocar. <strong>Inter</strong> carrega o body: parágrafos, labels, inputs, feedback. Limpa, neutra, legível em qualquer tamanho.
  </p>
  <div style="margin-top:18px; display:flex; gap:18px; flex-wrap:wrap; align-items:baseline;">
    <span style="font-family: var(--font-body); font-weight:700; font-size:14px;">700 Bold</span>
    <span style="font-family: var(--font-body); font-weight:500; font-size:14px;">500 Medium</span>
    <span style="font-family: var(--font-body); font-weight:400; font-size:14px;">400 Regular</span>
    <span style="font-family: var(--font-body); font-style: italic; font-weight:500; font-size:14px;">500 Italic slogan</span>
  </div>
  <div style="margin-top:10px; font-family: var(--font-body); font-weight:700; font-size:11px; letter-spacing:0.18em; text-transform: uppercase; color: var(--ink-soft);">
    Inter · 400 / 500 / 700 · sentence case
  </div>
</div>
</body></html>
