<!doctype html>
<html lang="pt-BR" data-theme="dark"><head>
<meta charset="utf-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" /><link rel="stylesheet" href="_card.css"/>
<style>
  html, body { background: #110A1F !important; }
  .card { background: #110A1F; color: #FFFCF2; padding: 28px 32px; }
  .swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .sw {
    border: 3px solid #FFFCF2;
    border-radius: 12px;
    box-shadow: 4px 4px 0 0 #FF3D7F;
    padding: 14px;
    height: 96px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .name { font-family: var(--font-display); font-weight:800; text-transform: uppercase; font-size:13px; letter-spacing: -0.01em; }
  .hex  { font-family: var(--font-mono); font-weight:700; font-size: 12px; }
</style>
</head><body>
<div class="card">
  <div class="swatches">
    <div class="sw" style="background:#110A1F; color:#FFFCF2">
      <div class="name">Bg</div>
      <div class="hex">#110A1F</div>
    </div>
    <div class="sw" style="background:#1E1432; color:#FFFCF2">
      <div class="name">Surface</div>
      <div class="hex">#1E1432</div>
    </div>
    <div class="sw" style="background:#C8BDD9; color:#0A0A0A">
      <div class="name">Ink-soft</div>
      <div class="hex">#C8BDD9</div>
    </div>
    <div class="sw" style="background:#FFFCF2; color:#0A0A0A">
      <div class="name">Ink</div>
      <div class="hex">#FFFCF2</div>
    </div>
  </div>
</div>
</body></html>
