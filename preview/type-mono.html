<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="_card.css"/>
</head><body>
<div class="card">
  <div style="display:flex; gap: 20px; align-items:center;">
    <div style="background: var(--info); border: 4px solid var(--ink); border-radius: 16px; box-shadow: 6px 6px 0 0 var(--shadow-color); padding: 14px 22px;">
      <div style="font-family: var(--font-mono); font-weight:700; font-size:48px; letter-spacing:-0.02em; font-variant-numeric: tabular-nums; line-height: 1;">00:08</div>
    </div>
    <div style="background: var(--primary); border: 4px solid var(--ink); border-radius: 16px; box-shadow: 6px 6px 0 0 var(--shadow-color); padding: 14px 22px;">
      <div style="font-family: var(--font-mono); font-weight:700; font-size:48px; letter-spacing:-0.02em; font-variant-numeric: tabular-nums; line-height: 1;">ABCD12</div>
    </div>
  </div>
  <div style="margin-top:16px; font-family: var(--font-body); font-weight:700; font-size:11px; letter-spacing:0.18em; text-transform: uppercase; color: var(--ink-soft);">
    JetBrains Mono · 500 / 700 · tabular-nums · timer + room code
  </div>
</div>
</body></html>
