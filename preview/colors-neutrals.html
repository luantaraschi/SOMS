<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="_card.css"/>
<style>
  .swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .sw {
    border: 3px solid var(--ink);
    border-radius: 12px;
    box-shadow: 4px 4px 0 0 var(--shadow-color);
    padding: 14px;
    height: 96px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .name { font-family: var(--font-display); font-weight:800; text-transform: uppercase; font-size:13px; letter-spacing: -0.01em; }
  .hex  { font-family: var(--font-mono); font-weight:700; font-size: 12px; }
</style>
</head><body>
<div class="card">
  <div class="swatches">
    <div class="sw" style="background:#FFFCF2">
      <div class="name">Bg</div>
      <div class="hex">#FFFCF2</div>
    </div>
    <div class="sw" style="background:var(--surface)">
      <div class="name">Surface</div>
      <div class="hex">#FFFFFF</div>
    </div>
    <div class="sw" style="background:#3D3D3D;color:#fff">
      <div class="name">Ink-soft</div>
      <div class="hex">#3D3D3D</div>
    </div>
    <div class="sw" style="background:#0A0A0A;color:#fff">
      <div class="name">Ink</div>
      <div class="hex">#0A0A0A</div>
    </div>
  </div>
</div>
</body></html>
