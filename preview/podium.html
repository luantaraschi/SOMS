<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="_card.css"/>
</head><body>
<div class="card" style="padding: 22px 32px;">
  <div style="display:flex; align-items:flex-end; justify-content: center; gap: 18px;">
    <!-- 2nd place -->
    <div style="
      background: var(--secondary); color:#fff;
      border: 4px solid var(--ink); border-radius: 16px;
      box-shadow: 8px 8px 0 0 var(--shadow-color);
      padding: 14px 16px; text-align: center;
      transform: rotate(2deg);
      width: 130px;
    ">
      <div style="font-family: var(--font-display); font-weight: 900; font-size: 28px;">2º</div>
      <div style="font-family: var(--font-display); font-weight: 800; font-size: 16px; text-transform: lowercase;">luan</div>
      <div style="font-family: var(--font-mono); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums;">980</div>
    </div>
    <!-- 1st place -->
    <div style="
      background: var(--primary);
      border: 4px solid var(--ink); border-radius: 16px;
      box-shadow: 12px 12px 0 0 var(--shadow-color);
      padding: 18px 16px; text-align: center;
      transform: rotate(-2deg);
      width: 158px;
    ">
      <div style="font-family: var(--font-display); font-weight: 900; font-size: 40px; line-height: 1;">1º</div>
      <div style="font-family: var(--font-display); font-weight: 800; font-size: 18px; text-transform: lowercase;">memi</div>
      <div style="font-family: var(--font-mono); font-weight: 700; font-size: 26px; font-variant-numeric: tabular-nums;">1.240</div>
    </div>
    <!-- 3rd place -->
    <div style="
      background: var(--info);
      border: 4px solid var(--ink); border-radius: 16px;
      box-shadow: 8px 8px 0 0 var(--shadow-color);
      padding: 12px 14px; text-align: center;
      transform: rotate(-1.5deg);
      width: 118px;
    ">
      <div style="font-family: var(--font-display); font-weight: 900; font-size: 24px;">3º</div>
      <div style="font-family: var(--font-display); font-weight: 800; font-size: 14px; text-transform: lowercase;">ana</div>
      <div style="font-family: var(--font-mono); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums;">720</div>
    </div>
  </div>
</div>
</body></html>
