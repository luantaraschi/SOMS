<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="_card.css"/>
<style>
  .row { display:flex; align-items:center; gap:18px; }
  .demo {
    background: var(--surface);
    border-radius: 12px;
    height: 64px; width: 120px;
    display:flex; align-items:center; justify-content:center;
    font-family: var(--font-mono); font-weight: 700; font-size: 14px;
  }
  .lbl { font-family: var(--font-body); font-weight:700; font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color: var(--ink-soft); margin-top:6px; }
</style>
</head><body>
<div class="card">
  <div class="row">
    <div>
      <div class="demo" style="border: 3px solid var(--ink); box-shadow: 4px 4px 0 0 var(--shadow-color);">3px</div>
      <div class="lbl">interactive</div>
    </div>
    <div>
      <div class="demo" style="border: 4px solid var(--ink); box-shadow: 6px 6px 0 0 var(--shadow-color);">4px</div>
      <div class="lbl">hero</div>
    </div>
    <div style="margin-left: 12px; font-family: var(--font-body); font-size: 13px; color: var(--ink-soft); max-width: 260px; line-height: 1.4;">
      Bordas <strong style="color:var(--ink)">sempre pretas</strong>, sempre 3 ou 4px. Nunca cinza, nunca 1px.
    </div>
  </div>
</div>
</body></html>
